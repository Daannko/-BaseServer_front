<div id="background">
  <app-navbar
    style="z-index: 1000"
    #navbar
    [isClockVisible]="true"
    [isLogoutVisible]="true"
  ></app-navbar>

  <ng-template
    #defaultNavbarTemplate
    let-getIsSearchOpen="getIsSearchOpen"
    let-toggleSearch="toggleSearch"
  >
    <div class="bar" *ngIf="!getIsSearchOpen()">
      <div class="board-navbar-controls">
        <button
          class="board-search-button"
          type="button"
          (click)="toggleSearch()"
          aria-label="Search boards"
          title="Search boards"
        >
          <span>Search boards</span>
        </button>

        <div class="global-search" *ngIf="selectedBoard">
          <app-svg-icon class="global-search-icon" icon="search"></app-svg-icon>
          <input
            class="global-search-input"
            type="text"
            [(ngModel)]="globalSearchQuery"
            (ngModelChange)="onGlobalSearchInput()"
            (focus)="globalSearchOpen = true"
            (keydown.escape)="closeGlobalSearch()"
            (keydown.enter)="globalSearchResults.length && goToGlobalResult(globalSearchResults[0])"
            placeholder="Search notes & sections  (Ctrl+F)"
            autocomplete="off"
            spellcheck="false"
          />
          <div
            class="global-search-results"
            *ngIf="globalSearchOpen && globalSearchQuery.trim().length"
          >
            <button
              class="global-search-result"
              *ngFor="let r of globalSearchResults"
              type="button"
              (click)="goToGlobalResult(r)"
            >
              <span class="global-search-kind" [class.is-section]="r.kind === 'section'">
                {{ r.kind === 'section' ? 'Section' : 'Note' }}
              </span>
              <span class="global-search-snippet"
                ><span class="gss-before">{{ r.match.before }}</span
                ><mark class="gss-hit">{{ r.match.hit }}</mark
                ><span class="gss-after">{{ r.match.after }}</span
              ></span>
            </button>
            <div class="global-search-empty" *ngIf="!globalSearchResults.length">
              No matches
            </div>
          </div>
        </div>
      </div>
    </div>
  </ng-template>

  <div class="board-container" #board>
    <div *ngIf="isSearchOpen">
      <div class="search" *ngIf="boards$ | async as boards">
        <section
          class="search-window"
          [class.is-fixed]="
            isCreateOpen ||
            (searchQuery.length > 0 && filteredBoards(boards).length === 0)
          "
          aria-label="Board search"
          (wheel)="$event.stopPropagation()"
          (click)="onSearchWindowClick($event)"
        >
          <!-- Top command bar -->
          <div class="command-bar">
            <app-svg-icon class="command-icon" icon="search"></app-svg-icon>

            <input
              *ngIf="!isCreateOpen"
              class="command-input"
              type="text"
              #searchInput
              [(ngModel)]="searchQuery"
              (keydown.enter)="onSearchEnter(boards)"
              placeholder="Search boards or create one…"
              autocomplete="off"
              spellcheck="false"
            />

            <button
              *ngIf="!isCreateOpen && searchQuery.length"
              class="command-clear"
              type="button"
              (click)="clearSearchQuery()"
            >
              Clear
            </button>

            <span *ngIf="isCreateOpen" class="command-title">
              Create board
            </span>

            <button
              class="command-close"
              type="button"
              (click)="isCreateOpen ? toggleCreateState() : toggleSearchState()"
            >
              <app-svg-icon
                [icon]="isCreateOpen ? 'chevron-left' : 'close-x'"
              ></app-svg-icon>
            </button>
          </div>

          <!-- Results -->
          <ng-container *ngIf="!isCreateOpen; else createMode">
            <div class="command-results">
              <ng-container
                *ngIf="
                  filteredBoards(boards).length || searchQuery.length === 0;
                  else noResults
                "
              >
                <div
                  class="command-item-row"
                  *ngFor="let b of filteredBoards(boards)"
                  (mousemove)="setRowHoverX($event)"
                  (mouseleave)="clearRowHoverX($event)"
                >
                  <button
                    class="command-item"
                    (click)="selectBoard(b.id)"
                  >
                    <span class="command-item-title">{{ b.name }}</span>
                    <span class="command-item-subtitle">{{ b.description }}</span>
                  </button>
                  <button
                    class="command-item-delete"
                    type="button"
                    title="Delete board"
                    (click)="openDeleteBoardConfirm(b, $event)"
                  >
                    <app-svg-icon icon="close-x"></app-svg-icon>
                  </button>
                </div>

                <button
                  class="command-item command-create"
                  type="button"
                  (click)="openCreateFromSearch(boards)"
                >
                  + Create board
                </button>
              </ng-container>

              <ng-template #noResults>
                <div class="command-empty">
                  No boards found — press enter to create one
                </div>
              </ng-template>
            </div>
          </ng-container>

          <!-- Create mode -->
          <ng-template #createMode>
            <div class="create-panel">
              <label class="create-field">
                <span>Name</span>
                <input
                  class="command-input"
                  type="text"
                  #newBoardNameInput
                  [(ngModel)]="newBoardName"
                  [class.is-invalid]="newBoardNameTouched && !isCreateNameValid"
                  [attr.placeholder]="
                    newBoardNameTouched && !isCreateNameValid
                      ? 'Name is required'
                      : 'e.g. Cooking'
                  "
                />
              </label>

              <label class="create-field">
                <span>Description</span>
                <textarea
                  class="command-textarea"
                  rows="3"
                  placeholder="What is this board about?"
                  [(ngModel)]="newBoardDescription"
                ></textarea>
              </label>

              <div class="create-actions">
                <button
                  class="primary"
                  type="button"
                  (click)="submitNewBoardRequest()"
                >
                  Create
                </button>
                <button
                  class="secondary"
                  type="button"
                  (click)="toggleCreateState()"
                >
                  Cancel
                </button>
              </div>
            </div>
          </ng-template>
        </section>
      </div>
    </div>

    <div class="board-viewport" #viewport>
      <!-- Sections always render below notes (separate stacking context) -->
      <div class="sections-layer">
        <ng-container *ngFor="let section of sections">
          <app-board-section
            [tile]="section"
            [zoom]="zoom"
            (mousedown)="bringSectionToFront(section)"
            (navbarChange)="onNoteNavbarChange($event)"
            (deleteSection)="onDeleteSection(section)"
            *ngIf="isItemVisible(section)"
          >
          </app-board-section>
        </ng-container>
      </div>

      <div #itemsContainer class="notes-layer">
        <ng-container *ngFor="let item of notes">
          <app-board-note
            [tile]="item"
            [zoom]="zoom"
            (mousedown)="bringToFront(item)"
            (dblclick)="onNoteDblClick($event, item)"
            (navbarChange)="onNoteNavbarChange($event)"
            (deleteTile)="onDeleteNote(item)"
            *ngIf="isItemVisible(item)"
          >
          </app-board-note>
        </ng-container>
      </div>

      <div class="images-layer">
        <ng-container *ngFor="let image of images">
          <app-board-image
            [tile]="image"
            [zoom]="zoom"
            (mousedown)="bringToFront(image)"
            (deleteImage)="onDeleteImage(image)"
            *ngIf="isItemVisible(image)"
          >
          </app-board-image>
        </ng-container>
      </div>

      <!-- Drawings: each freehand stroke is a movable/deletable element. -->
      <div class="drawings-layer">
        <ng-container *ngFor="let drawing of drawings">
          <app-board-drawing
            [tile]="drawing"
            [zoom]="zoom"
            (mousedown)="bringToFront(drawing)"
            (deleteDrawing)="onDeleteDrawing(drawing)"
            *ngIf="isItemVisible(drawing)"
          >
          </app-board-drawing>
        </ng-container>
      </div>

      <!-- In-progress stroke, rendered in world space (visual only). The actual
           pointer capture is a screen-space overlay below, so it isn't limited
           by the (collapsed) viewport box. -->
      <svg class="draw-active" *ngIf="drawMode">
        <path
          *ngIf="drawing && drawTool === 'pen' && activeStrokeD"
          [attr.d]="activeStrokeD"
          [attr.stroke]="drawColor"
          [attr.stroke-width]="activeStrokeWidth"
          fill="none"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>

      <!-- Snap alignment guides (world coordinates, drawn during drag/resize) -->
      <ng-container *ngIf="snapGuides$ | async as guides">
        <div
          *ngFor="let l of guides.lines"
          class="snap-guide-line"
          [class.snap-guide-line--h]="l.orientation === 'h'"
          [style.left.px]="l.orientation === 'v' ? l.pos : l.from"
          [style.top.px]="l.orientation === 'v' ? l.from : l.pos"
          [style.width.px]="l.orientation === 'v' ? 0 : l.to - l.from"
          [style.height.px]="l.orientation === 'v' ? l.to - l.from : 0"
          [style.borderLeftWidth.px]="l.orientation === 'v' ? 1.5 / zoom : 0"
          [style.borderTopWidth.px]="l.orientation === 'h' ? 1.5 / zoom : 0"
        ></div>
        <div
          *ngFor="let r of guides.rects"
          class="snap-guide-rect"
          [style.left.px]="r.x"
          [style.top.px]="r.y"
          [style.width.px]="r.width"
          [style.height.px]="r.height"
          [style.borderWidth.px]="1.5 / zoom"
        ></div>
      </ng-container>

      <!-- Original-ratio reference while resizing an image -->
      <ng-container *ngIf="aspectGuide$ | async as ag">
        <div
          class="aspect-guide-line"
          [style.left.px]="ag.vLineX"
          [style.top.px]="ag.vLineTop"
          [style.height.px]="ag.vLineHeight"
          [style.borderLeftWidth.px]="1 / zoom"
        ></div>
        <div
          class="aspect-guide-line"
          [style.left.px]="ag.hLineLeft"
          [style.top.px]="ag.hLineY"
          [style.width.px]="ag.hLineWidth"
          [style.borderTopWidth.px]="1 / zoom"
        ></div>
        <div
          class="aspect-guide-label"
          [style.left.px]="ag.crossX"
          [style.top.px]="ag.crossY"
          [style.fontSize.px]="11 / zoom"
          [style.padding.px]="3 / zoom"
          [style.transform]="
            'translate(' + (5 / zoom) + 'px, ' + (5 / zoom) + 'px)'
          "
        >{{ ag.label }}</div>
      </ng-container>
    </div>

    <!-- Screen-space draw capture: covers the whole board so strokes can start
         anywhere. Passes through while Space is held (to pan). -->
    <div
      class="draw-capture"
      *ngIf="drawMode"
      [class.draw-capture--panning]="spaceHeld"
      (pointerdown)="onDrawPointerDown($event)"
      (pointermove)="onDrawPointerMove($event)"
      (pointerup)="onDrawPointerUp()"
      (pointercancel)="onDrawPointerUp()"
      (pointerleave)="cursorInside = false"
    ></div>

    <!-- Brush/eraser cursor preview (follows the mouse in draw mode). -->
    <div
      class="brush-cursor"
      *ngIf="drawMode && !spaceHeld && cursorInside"
      [class.brush-cursor--eraser]="drawTool === 'eraser'"
      [style.left.px]="cursorX"
      [style.top.px]="cursorY"
      [style.width.px]="brushCursorSize"
      [style.height.px]="brushCursorSize"
      [style.background]="drawTool === 'pen' ? drawColor : 'transparent'"
      [style.borderColor]="drawTool === 'pen' ? drawColor : 'rgba(255,255,255,0.8)'"
    ></div>
  </div>

  <!-- Delete board confirmation modal -->
  <div class="delete-modal-backdrop" *ngIf="deleteBoardPending" (click)="cancelDeleteBoard()">
    <div class="delete-modal" (click)="$event.stopPropagation()">
      <h3 class="delete-modal-title">Delete board</h3>
      <p class="delete-modal-hint">Type <span class="delete-modal-board-name">{{ deleteBoardPending.name }}</span> to confirm:</p>
      <div class="delete-modal-input-wrap">
        <div class="delete-modal-chars" aria-hidden="true">
          <span
            *ngFor="let c of deleteConfirmChars"
            [class.char-ghost]="c.status === 'ghost'"
            [class.char-correct]="c.status === 'correct'"
            [class.char-wrong]="c.status === 'wrong'"
          >{{ c.char }}</span>
        </div>
        <input
          class="delete-modal-input"
          [(ngModel)]="deleteConfirmInput"
          (keydown.enter)="confirmDeleteBoard()"
          (keydown.escape)="cancelDeleteBoard()"
          autocomplete="off"
          spellcheck="false"
          autofocus
        />
      </div>
      <div class="delete-modal-actions">
        <button class="delete-modal-confirm" [disabled]="!deleteConfirmValid" (click)="confirmDeleteBoard()">Delete</button>
        <button class="delete-modal-cancel" (click)="cancelDeleteBoard()">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Draw-mode navbar (injected via NavbarService, mirrors the note menu) -->
  <ng-template #drawNavbarTemplate>
    <div class="bar draw-bar">
      <div class="navbar-tile-controls">
        <div
          class="color-picker-container"
          (mouseenter)="isDrawPaletteVisible = true"
          (mouseleave)="isDrawPaletteVisible = false"
        >
          <button
            class="draw-paint-button"
            [class.active]="drawTool === 'pen'"
            (click)="setDrawTool('pen')"
            title="Brush color"
          >
            <app-svg-icon
              icon="paint-brush"
              [style.color]="drawColor"
            ></app-svg-icon>
          </button>
          <div class="color-palette" [class.open]="isDrawPaletteVisible">
            <div class="temp"></div>
            <app-color-palette
              variant="dropdown"
              [rows]="2"
              [swatchCount]="10"
              [swatchSize]="28"
              [selected]="drawColor"
              [history]="true"
              [allowCustom]="true"
              (colorChange)="onDrawColorChange($event)"
            ></app-color-palette>
          </div>
        </div>
        <button
          class="draw-eraser-button"
          [class.active]="drawTool === 'eraser'"
          (click)="toggleEraser()"
          title="Eraser"
        >
          <app-svg-icon icon="eraser"></app-svg-icon>
        </button>
        <div class="navbar-spacer"></div>
        <input
          type="range"
          class="draw-width-slider"
          min="1"
          max="60"
          step="1"
          [(ngModel)]="drawWidth"
          title="Line thickness"
        />
        <input
          type="number"
          class="note-option-input draw-width-num"
          min="1"
          step="1"
          [(ngModel)]="drawWidth"
          title="Line thickness (px)"
        />
        <span class="draw-width-unit">px</span>
        <div class="navbar-spacer"></div>
        <button class="draw-bar-clear" type="button" (click)="clearDrawing()">
          Clear
        </button>
      </div>
    </div>
  </ng-template>

  <!-- Drawing selection navbar (merge / unmerge) -->
  <ng-template #selectionNavbarTemplate>
    <div class="bar draw-bar">
      <div class="navbar-tile-controls">
        <strong>{{ selectionCount }} selected</strong>
        <div class="navbar-spacer"></div>
        <button
          *ngIf="canMergeDrawings"
          class="draw-bar-clear"
          type="button"
          (click)="mergeSelectedDrawings()"
        >
          Merge
        </button>
        <button
          *ngIf="canUnmergeDrawing"
          class="draw-bar-clear"
          type="button"
          (click)="unmergeSelectedDrawing()"
        >
          Unmerge
        </button>
        <span class="draw-bar-hint">Ctrl+click to select more</span>
      </div>
    </div>
  </ng-template>

  <app-context-menu
    [visible]="ctxMenu.visible"
    [x]="ctxMenu.x"
    [y]="ctxMenu.y"
    [items]="ctxMenu.items"
    (closed)="closeContextMenu()"
    (itemSelected)="onContextMenuItem($event)"
  ></app-context-menu>
</div>
