<?xml version="1.0" encoding="utf-8"?>

<!-- Text-highlight icon: same "A" as editor-textcolor, but the right half is
     covered by a highlight block in which the letter is knocked out. -->
<svg width="800px" height="800px" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <path id="hl-a" d="M13.23 15h1.9L11 4H9L5 15h1.88l1.07-3h4.18zm-1.53-4.54H8.51L10 5.6z"/>
    <clipPath id="hl-left">
      <rect x="0" y="0" width="10" height="20"/>
    </clipPath>
    <mask id="hl-knock">
      <rect x="10" y="3" width="6.2" height="13.2" rx="1.2" fill="#fff"/>
      <use href="#hl-a" fill="#000"/>
    </mask>
  </defs>

  <g transform="translate(10 10) scale(1.18 1.06) translate(-10 -10)">
    <!-- left half of the A, drawn normally -->
    <use href="#hl-a" clip-path="url(#hl-left)"/>

    <!-- highlight block over the right half; the A is transparent inside it -->
    <rect x="10" y="3" width="6.2" height="13.2" rx="1.2" mask="url(#hl-knock)"/>
  </g>

</svg>
