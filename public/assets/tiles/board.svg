<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#fff" stroke="none" opacity=".45"/>
    </pattern>
  </defs>
  <rect width="600" height="400" fill="url(#dots)" stroke="none"/>

  <!-- section frame -->
  <rect x="330" y="150" width="236" height="214" rx="16" stroke-dasharray="7 7" opacity=".6"/>
  <rect x="346" y="134" width="76" height="20" rx="10" fill="#fff" fill-opacity=".1" stroke="none"/>

  <!-- note -->
  <rect x="236" y="52" width="150" height="104" rx="12" fill="#fff" fill-opacity=".07"/>
  <path d="M254 76h88M254 96h114M254 116h96M254 136h56" opacity=".7"/>

  <!-- image inside the section -->
  <rect x="352" y="182" width="118" height="84" rx="10" fill="#fff" fill-opacity=".05"/>
  <path d="m352 250 34-32 26 24 18-16 40 36" opacity=".7"/>
  <circle cx="440" cy="204" r="8" opacity=".7"/>

  <!-- quiz card -->
  <rect x="412" y="284" width="136" height="62" rx="10" fill="#fff" fill-opacity=".07"/>
  <circle cx="436" cy="315" r="10" stroke="#f0803c"/>
  <path d="m431 315 4 4 7-8" stroke="#f0803c"/>
  <path d="M458 306h70M458 324h48" opacity=".7"/>

  <!-- connector from the note into the section -->
  <path d="M386 104c72 0 122 20 122 78" stroke="#f0803c" stroke-width="2"/>
  <path d="m500 172 8 12 9-11" stroke="#f0803c" stroke-width="2"/>

  <!-- freehand stroke -->
  <path d="M250 214c22-30 40 28 62 2s34-36 44-10" stroke="#f0803c" stroke-width="2.4" opacity=".85"/>
</svg>
